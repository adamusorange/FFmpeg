# この fork のタグから、FFmpeg の LGPL のビルドを組んでリリースに上げる。
#
# 組み方は BtbN/FFmpeg-Builds のスクリプトをそのまま使う (改造しない)。
# 差し替えるのは FFmpeg のソースの取得元 (FFMPEG_REPO_OVERRIDE / GIT_BRANCH_OVERRIDE) と、
# 構成が slim のときのビルド用イメージ (slim/ の Dockerfile で派生させたもの)。
# ビルド用イメージは copy-image.yml で写したものを digest で固定する。
#
# 向け先 (target):
#   win64    Windows 向けの LGPL shared (DLL)。DamukoPla (Windows 版) が使う
#   linux64  Linux (x86-64) 向けの LGPL static。DamukoPla のメディアサーバーが変換に使う ffmpeg の CLI。
#            構成は full だけ (slim/ は mingw-w64 の構成のため)
#
# 構成:
#   full  BtbN の <target>-<variant> の構成のまま。Windows では見本を作る道具、Linux ではサーバーの変換に使う
#   slim  DamukoPla が使う部品だけに絞った構成 (slim/configure.txt)。DamukoPla が同梱する (win64 だけ)
# 同じタグのリリースに並べる。slim の資産名には -slim を付ける (BtbN の出力名が同じになるため)。
#
# 試しの組 (部品を外したときの大きさ、LTO など) は extra_configure で slim の configure に引数を足し、
# publish を外してリリースに上げずに Actions の成果物として残す。
name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 組むタグ (この fork のもの)
        required: true
        default: n9.0.1-damuko-9b0578816c-oapvfix-slices256
      target:
        description: 向け先 (win64 は Windows 版の同梱用、linux64 はメディアサーバーの変換用で構成は full だけ)
        type: choice
        options:
          - win64
          - linux64
        default: win64
      config:
        description: 構成 (slim は同梱用、full は見本を作る道具用)
        type: choice
        options:
          - slim
          - full
        default: slim
      prerelease:
        description: プレリリースにする (比較用の組など)
        type: boolean
        default: false
      extra_configure:
        description: slim の configure に足す引数 (試しの組。例 --disable-encoder=mpeg4)
        required: false
        default: ""
      publish:
        description: リリースに上げる (外すと Actions の成果物として残す)
        type: boolean
        default: true
      revision:
        description: slim の組の版。同じタグを構成を変えて組み直すとき、資産名に -r<版> を付ける (空なら付けない)
        required: false
        default: ""

# 同じタグのリリースを 2 つの構成が同時に作らないようにする。リリースに上げない試しの組は並べて回せる
concurrency:
  group: release-${{ inputs.source_tag }}${{ !inputs.publish && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

env:
  BTBN_REPOSITORY: https://github.com/BtbN/FFmpeg-Builds.git
  BTBN_COMMIT: 54e192626545d0234b2a1383a34a29169cf52877
  # copy-image.yml で写したもの (win64 は 2026-09-27、linux64 は 2026-10-09)。写す元は BUILD_IMAGE_SOURCE
  BUILD_IMAGE: ${{ inputs.target == 'linux64'
    && 'ghcr.io/adamusorange/ffmpeg/linux64-lgpl-9.0@sha256:82aa09309d711f2b83f3500bfea10bfe085c595fa328557c3fa281f6b5b0c5f7'
    || 'ghcr.io/adamusorange/ffmpeg/win64-lgpl-shared-9.0@sha256:9bf576f1e75f4b3b456ef71793e52a93ee2b777f51c78b5b19742a83d187e897' }}
  BUILD_IMAGE_SOURCE: ${{ inputs.target == 'linux64'
    && 'ghcr.io/btbn/ffmpeg-builds/linux64-lgpl-9.0@sha256:82aa09309d711f2b83f3500bfea10bfe085c595fa328557c3fa281f6b5b0c5f7'
    || 'ghcr.io/btbn/ffmpeg-builds/win64-lgpl-shared-9.0@sha256:9bf576f1e75f4b3b456ef71793e52a93ee2b777f51c78b5b19742a83d187e897' }}
  TARGET: ${{ inputs.target }}
  # Linux はサーバーの CLI だけに使うので、1 つの実行ファイルで済む static にする
  VARIANT: ${{ inputs.target == 'linux64' && 'lgpl' || 'lgpl-shared' }}
  ADDIN: "9.0"
  CONFIG: ${{ inputs.config }}
  EXTRA_CONFIGURE: ${{ inputs.extra_configure }}
  PUBLISH: ${{ inputs.publish }}
  REVISION: ${{ inputs.revision }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve source
        id: source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_IMAGE" != *@sha256:* ]]; then
            echo "::error::BUILD_IMAGE を digest で指定してください"
            exit 1
          fi
          if [[ "$CONFIG" != full && "$CONFIG" != slim ]]; then
            echo "::error::構成は full か slim です: ${CONFIG}"
            exit 1
          fi
          if [[ "$TARGET" != win64 && "$TARGET" != linux64 ]]; then
            echo "::error::向け先は win64 か linux64 です: ${TARGET}"
            exit 1
          fi
          if [[ "$TARGET" == linux64 && "$CONFIG" != full ]]; then
            echo "::error::linux64 は full だけです (slim/ は mingw-w64 の構成)"
            exit 1
          fi
          if [[ -n "$REVISION" && ( "$CONFIG" != slim || ! "$REVISION" =~ ^[0-9]+$ ) ]]; then
            echo "::error::revision は slim でだけ使える数です: ${REVISION}"
            exit 1
          fi
          if [[ -n "$EXTRA_CONFIGURE" && "$CONFIG" != slim ]]; then
            echo "::error::extra_configure は slim でだけ使えます"
            exit 1
          fi
          # 足した引数で組んだものを、正式な資産と取り違えないようにする
          if [[ -n "$EXTRA_CONFIGURE" && "$PUBLISH" == true ]]; then
            echo "::error::extra_configure を使うときは publish を外してください"
            exit 1
          fi
          refs="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${SOURCE_TAG}" "refs/tags/${SOURCE_TAG}^{}")"
          # 注釈付きのタグなら ^{} がコミットを指す
          commit="$(awk -v t="refs/tags/${SOURCE_TAG}^{}" '$2 == t { print $1 }' <<< "$refs")"
          [[ -n "$commit" ]] || commit="$(awk -v t="refs/tags/${SOURCE_TAG}" '$2 == t { print $1 }' <<< "$refs")"
          if [[ -z "$commit" ]]; then
            echo "::error::タグがありません: ${SOURCE_TAG}"
            exit 1
          fi
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      # slim/ の Dockerfile と構成を読むため、このワークフローのコミットを取る
      - name: Fetch workflow files
        run: |
          set -euo pipefail
          git init -q workflow
          git -C workflow fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -C workflow checkout -q --detach FETCH_HEAD

      - name: Fetch BtbN/FFmpeg-Builds
        run: |
          set -euo pipefail
          git init -q btbn
          git -C btbn fetch -q --depth 1 "$BTBN_REPOSITORY" "$BTBN_COMMIT"
          git -C btbn checkout -q --detach FETCH_HEAD
          test "$(git -C btbn rev-parse HEAD)" = "$BTBN_COMMIT"

      - name: Free disk space
        working-directory: btbn
        run: ./util/free_disk_space.sh

      - name: Pull build image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker pull "$BUILD_IMAGE"

      # slim の依存の tarball を取り、SHA-256 を確かめてから派生イメージに渡す
      - name: Fetch slim dependencies
        if: inputs.config == 'slim'
        working-directory: workflow/slim
        run: |
          set -euo pipefail
          mkdir -p sources
          while read -r name version license url sha256; do
            [[ -z "$name" || "$name" == \#* ]] && continue
            case "$url" in
              *.tar.xz) ext=tar.xz ;;
              *.tar.gz) ext=tar.gz ;;
              *) echo "::error::tarball の形が分かりません: ${url}"; exit 1 ;;
            esac
            curl -fsSL --retry 3 -o "sources/${name}.${ext}" "$url" < /dev/null
            echo "${sha256}  sources/${name}.${ext}" | sha256sum -c -
          done < sources.txt

      - name: Prepare build image
        run: |
          set -euo pipefail
          # build.sh が使う名前。手元にあるので build.sh は取りに行かない
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}-${VARIANT}-${ADDIN}:latest"
          if [[ "$CONFIG" == slim ]]; then
            ff_configure="$(sed 's/#.*//' workflow/slim/configure.txt | xargs)"
            # configure は、--enable-<種類>=<名前> で求めた部品が後から外れると「Disabled ... because」と警告し、
            # --fatal-warnings で止まる。足す引数で外す部品は、元の構成の --enable-<種類>=... から抜いておく
            set -f
            for extra in $EXTRA_CONFIGURE; do
              [[ "$extra" =~ ^--disable-([a-z]+)=(.+)$ ]] || continue
              kind="${BASH_REMATCH[1]}"
              IFS=',' read -ra names <<< "${BASH_REMATCH[2]}"
              rebuilt=()
              for arg in $ff_configure; do
                if [[ "$arg" != --enable-"$kind"=* ]]; then
                  rebuilt+=("$arg")
                  continue
                fi
                IFS=',' read -ra items <<< "${arg#*=}"
                kept=()
                for item in "${items[@]}"; do
                  drop=
                  for name in "${names[@]}"; do
                    [[ "$item" == "$name" ]] && drop=1
                  done
                  [[ -n "$drop" ]] || kept+=("$item")
                done
                if (( ${#kept[@]} )); then
                  rebuilt+=("--enable-${kind}=$(IFS=,; echo "${kept[*]}")")
                fi
              done
              ff_configure="${rebuilt[*]}"
            done
            set +f
            # 後に書いた引数が勝つので、足す引数は末尾に置く
            [[ -z "$EXTRA_CONFIGURE" ]] || ff_configure="${ff_configure} ${EXTRA_CONFIGURE}"
            docker build --pull=false \
              --build-arg BASE_IMAGE="$BUILD_IMAGE" \
              --build-arg FF_CONFIGURE="$ff_configure" \
              -t "$image" workflow/slim
          else
            docker tag "$BUILD_IMAGE" "$image"
          fi
          docker image inspect "$image" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^FF_'

      - name: Build
        id: build
        working-directory: btbn
        env:
          FFMPEG_REPO_OVERRIDE: https://github.com/${{ github.repository }}.git
          GIT_BRANCH_OVERRIDE: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          ./build.sh "$TARGET" "$VARIANT" "$ADDIN" 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"

      # 試しの組は、決めた構成から外れるのが目的なので、結果を残すだけで止めない
      - name: Check configure
        if: inputs.config == 'slim'
        continue-on-error: ${{ inputs.extra_configure != '' }}
        run: bash workflow/slim/check-configure.sh build.log

      - name: Describe build
        id: describe
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          BUILD_NAME: ${{ steps.build.outputs.build_name }}
        run: |
          set -euo pipefail
          test -n "$BUILD_NAME"
          asset="$BUILD_NAME"
          [[ "$CONFIG" == full ]] || asset="${BUILD_NAME}-${CONFIG}"
          # 同じタグを構成を変えて組み直したもの。資産は上書きしないので名前を変える
          [[ -z "$REVISION" ]] || asset="${asset}-r${REVISION}"
          # BtbN は Windows を zip、Linux を tar.xz にまとめる
          ext=zip
          [[ "$TARGET" != linux64 ]] || ext=tar.xz
          archive="btbn/artifacts/${asset}.${ext}"
          if [[ "$asset" != "$BUILD_NAME" ]]; then
            mv "btbn/artifacts/${BUILD_NAME}.${ext}" "$archive"
          fi
          test -f "$archive"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"

          # build.sh がコンテナの中で実際に渡した configure の引数 (set -x の出力)
          configure_command="$(grep -m1 '^+ ./configure ' build.log | sed 's/^+ //')"
          test -n "$configure_command"

          if [[ "$CONFIG" == slim ]]; then
            dependencies="$(jq -Rn '[inputs | select(test("^\\s*(#|$)") | not) | [splits("\\s+")]
              | { name: .[0], version: .[1], license: .[2], url: .[3], sha256: .[4] }]' \
              < workflow/slim/sources.txt)"
          else
            # BtbN のイメージの依存。版は btbn_commit のスクリプトにある
            dependencies=null
          fi

          jq -n \
            --arg config "$CONFIG" \
            --arg revision "$REVISION" \
            --arg source_repository "https://github.com/${GITHUB_REPOSITORY}" \
            --arg source_tag "$SOURCE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg btbn_repository "$BTBN_REPOSITORY" \
            --arg btbn_commit "$BTBN_COMMIT" \
            --arg build_image "$BUILD_IMAGE" \
            --arg build_image_source "$BUILD_IMAGE_SOURCE" \
            --arg target "$TARGET" \
            --arg variant "$VARIANT" \
            --arg addin "$ADDIN" \
            --arg configure_command "$configure_command" \
            --argjson dependencies "$dependencies" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg archive_name "${asset}.${ext}" \
            --arg archive_sha256 "$sha256" \
            '$ARGS.named' > "btbn/artifacts/${asset}.json"
          cat "btbn/artifacts/${asset}.json"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"

          # リリースの説明は、どの向け先を組んだときも同じ文にする (後から組んだものが上書きするため)
          {
            echo "FFmpeg の LGPL ビルド (\`${ADDIN}\` 系)。"
            echo
            echo "- ソース: [\`${SOURCE_TAG}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${SOURCE_COMMIT}) (\`${SOURCE_COMMIT}\`)"
            echo "- 組み方: [BtbN/FFmpeg-Builds](https://github.com/BtbN/FFmpeg-Builds/tree/${BTBN_COMMIT}) のスクリプトをそのまま使用"
            echo "- ビルド用イメージは資産ごとの \`.json\` の \`build_image\` にある"
            echo
            echo "資産名で見分けます。"
            echo
            echo "- \`...-win64-lgpl-shared-${ADDIN}.zip\` (Windows、full): BtbN の構成のまま"
            echo "- \`...-win64-lgpl-shared-${ADDIN}-slim.zip\` (Windows、slim): DamukoPla が使う部品だけに絞った構成。"
            echo "  依存 (dav1d・soxr・zlib・nv-codec-headers・Opus・LAME) を正式リリースから組み直したイメージで組む。"
            echo "  同じタグを構成を変えて組み直したものは \`-slim-r<版>\` で、版の大きいものが新しい"
            echo "  構成と依存はこの fork の \`damukopla\` 枝の \`slim/\` にある"
            echo "- \`...-linux64-lgpl-${ADDIN}.tar.xz\` (Linux x86-64、static、full): BtbN の構成のまま。"
            echo "  DamukoPla のメディアサーバーが変換に使う \`ffmpeg\` の CLI"
            echo
            echo "上流の FFmpeg からの変更点は、ソースのタグと上流の差分で確かめられます。"
            echo "資産ごとの \`.json\` に、ソース・スクリプト・イメージ・configure の引数・依存とアーカイブの SHA-256 を記録しています。"
          } > btbn/artifacts/notes.md

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          ASSET: ${{ steps.describe.outputs.asset }}
          EXT: ${{ steps.describe.outputs.ext }}
        run: |
          set -euo pipefail
          if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file btbn/artifacts/notes.md
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$SOURCE_TAG" --notes-file btbn/artifacts/notes.md "${flags[@]}"
          fi
          # 同じ名前の資産は上書きしない。取り込み側は SHA-256 で固定している
          gh release upload "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            "btbn/artifacts/${ASSET}.${EXT}" "btbn/artifacts/${ASSET}.json"

      - name: Upload artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.describe.outputs.asset }}
          path: |
            btbn/artifacts/${{ steps.describe.outputs.asset }}.${{ steps.describe.outputs.ext }}
            btbn/artifacts/${{ steps.describe.outputs.asset }}.json
            build.log
          if-no-files-found: error
